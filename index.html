<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>플래시카드 복습 분류기</title>
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #6b6560; --card: #ffffff;
    --border: #d6d3d1; --accent: #2563eb; --accent-fg: #ffffff; --error: #b91c1c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK KR", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --fg: #ececea; --muted: #a09a94; --card: #1d1c1b;
      --border: #3a3836; --accent: #6ea0ff; --accent-fg: #0b1220; --error: #f87171;
    }
  }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 28px 0 8px; }
  .note { color: var(--muted); font-size: .875rem; margin: 0 0 8px; }
  textarea {
    display: block; width: 100%; height: 200px; padding: 10px;
    font: 13px/1.5 var(--mono); white-space: pre; overflow: auto; resize: vertical;
    color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
  textarea.drag { border-color: var(--accent); outline: 2px solid var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  button, .filebtn {
    font: inherit; font-size: .9rem; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    color: var(--fg); background: var(--card); border: 1px solid var(--border);
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=file] { display: none; }
  .error { color: var(--error); margin: 12px 0 0; font-weight: 600; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
  .stat b { display: block; font-size: 1.25rem; }
  .stat span { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>플래시카드 복습 분류기</h1>
  <p class="note">모든 처리는 브라우저 안에서만 이루어지며 어떤 데이터도 업로드되지 않습니다.</p>

  <h2>입력</h2>
  <textarea id="input" spellcheck="false" placeholder="내보낸 덱 텍스트를 붙여넣거나, 파일을 이 영역에 끌어다 놓으세요."></textarea>
  <div class="row">
    <label class="filebtn">파일 선택<input type="file" id="file" accept=".txt,.tsv,text/plain"></label>
  </div>
  <p class="error" id="error" role="alert" hidden></p>

  <h2>요약</h2>
  <div class="summary" id="summary"></div>

  <h2>출력</h2>
  <textarea id="output" readonly spellcheck="false"></textarea>
  <div class="row">
    <button class="primary" id="copy" disabled>복사</button>
    <button id="download" disabled>다운로드</button>
  </div>
</main>

<script type="module">
import { classify } from './classifier.js';

const $ = (id) => document.getElementById(id);
const input = $('input'), output = $('output'), errorEl = $('error'), summary = $('summary');
const copyBtn = $('copy'), dlBtn = $('download');
let baseName = 'review';

const LABELS = ['0 · 미복습', '1 · 0–20%', '2 · 20–40%', '3 · 40–60%', '4 · 60–80%', '5 · 80–100% 미만'];

function card(label, value) {
  const d = document.createElement('div');
  d.className = 'stat';
  const b = document.createElement('b'); b.textContent = String(value);
  const s = document.createElement('span'); s.textContent = label;
  d.append(b, s);
  return d;
}

function render(res) {
  summary.replaceChildren();
  if (!res) { summary.append(card('전체 행', '-'), card('제외 (100%)', '-')); return; }
  summary.append(card('전체 행', res.total), card('제외 (100%)', res.excluded));
  for (let c = 0; c <= 5; c++) summary.append(card('카테고리 ' + LABELS[c], res.counts[c]));
  if (res.skipped) summary.append(card('건너뜀 (통계 오류)', res.skipped));
}

function process() {
  errorEl.hidden = true;
  const text = input.value;
  if (!text.trim()) { output.value = ''; render(null); copyBtn.disabled = dlBtn.disabled = true; return; }
  try {
    const res = classify(text);
    output.value = res.output;
    render(res);
    copyBtn.disabled = dlBtn.disabled = false;
  } catch (e) {
    output.value = '';
    render(null);
    errorEl.textContent = e.message;
    errorEl.hidden = false;
    copyBtn.disabled = dlBtn.disabled = true;
  }
}

async function loadFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    baseName = file.name.replace(/\.[^.]*$/, '') || 'review';
    input.value = text;
    process();
  } catch (e) {
    errorEl.textContent = '파일을 읽을 수 없습니다: ' + (e && e.message ? e.message : e);
    errorEl.hidden = false;
  }
}

input.addEventListener('input', () => { baseName = 'review'; process(); });
$('file').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
window.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (e.target === input) input.classList.add('drag');
});
window.addEventListener('dragleave', () => input.classList.remove('drag'));
window.addEventListener('drop', (e) => {
  e.preventDefault();
  input.classList.remove('drag');
  if (e.dataTransfer && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

const copyLabel = copyBtn.textContent;
let copyTimer;
copyBtn.addEventListener('click', async () => {
  let ok = false;
  try {
    await navigator.clipboard.writeText(output.value);
    ok = true;
  } catch {
    try {
      output.select();
      ok = document.execCommand('copy');
    } catch { ok = false; }
  }
  copyBtn.textContent = ok ? '복사됨' : '복사 실패';
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { copyBtn.textContent = copyLabel; }, 1200);
});

dlBtn.addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([output.value], { type: 'text/plain;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = baseName + '-review.txt';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

render(null);
</script>
</body>
</html>
